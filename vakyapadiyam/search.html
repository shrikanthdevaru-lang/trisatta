<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Vākyapadīyam</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .search-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .search-input-wrapper {
      position: relative;
      margin-bottom: var(--sp-2xl);
    }
    .search-input {
      width: 100%;
      padding: var(--sp-lg) var(--sp-xl);
      padding-left: 60px;
      font-size: 1.25rem;
      font-family: var(--font-ui);
      background: var(--clr-glass-2);
      border: 1px solid var(--clr-border-2);
      border-radius: var(--r-full);
      color: var(--clr-text);
      outline: none;
      transition: all var(--t-base);
      box-shadow: var(--shadow-glass);
    }
    .search-input:focus {
      border-color: var(--clr-gold);
      box-shadow: 0 0 30px rgba(201,169,110,0.2);
    }
    .search-icon {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem;
      color: var(--clr-gold);
      pointer-events: none;
    }
    .search-result {
      background: var(--clr-glass);
      border: 1px solid var(--clr-border);
      border-radius: var(--r-lg);
      padding: var(--sp-lg);
      margin-bottom: var(--sp-md);
      transition: all var(--t-fast);
      display: block;
      text-decoration: none;
    }
    .search-result:hover {
      background: var(--clr-glass-2);
      border-color: var(--clr-border-2);
      transform: translateY(-2px);
    }
    .result-kanda {
      font-size: 0.85rem;
      color: var(--clr-gold);
      margin-bottom: var(--sp-sm);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .result-sanskrit {
      font-size: 1.25rem;
      color: var(--clr-devanagari);
      margin-bottom: var(--sp-sm);
    }
    .result-translation {
      color: var(--clr-text-2);
      font-family: var(--font-serif);
      font-size: 1.1rem;
    }
    .highlight {
      background: rgba(201, 169, 110, 0.3);
      color: #fff;
      padding: 0 2px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <span class="brand-deva">वाक्यपदीयम्</span>
      <span class="brand-en">Vākyapadīyam</span>
    </a>
    <div class="navbar-nav">
      <a href="index.html"><span class="nav-icon">🏠</span> Home</a>
      <a href="text.html"><span class="nav-icon">📖</span> Text Browser</a>
      <a href="concepts.html"><span class="nav-icon">🧠</span> Concepts</a>
      <a href="scholar.html"><span class="nav-icon">📚</span> Scholar</a>
      <a href="search.html" class="active"><span class="nav-icon">🔍</span> Search</a>
      <a href="chat.html"><span class="nav-icon">🤖</span> AI Chat</a>
    </div>
  </nav>

  <main class="page-content">
    <div class="container section search-container">
      
      <div class="text-center mb-xl animate-fadeInUp">
        <h1 class="text-gold">Search the Text</h1>
        <p class="text-serif text-lg mt-sm">Search across Sanskrit (Devanagari/IAST), English, and Hindi translations.</p>
      </div>

      <div class="search-input-wrapper animate-fadeInUp" style="animation-delay: 0.1s;">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="e.g. Brahman, Sphota, शब्द...">
      </div>

      <div id="search-results" class="animate-fadeInUp" style="animation-delay: 0.2s;">
        <div class="text-center text-muted p-lg">Type a keyword to begin searching.</div>
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
