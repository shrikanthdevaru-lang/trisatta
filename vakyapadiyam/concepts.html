<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept Explorer | Vākyapadīyam</title>
  
  <link rel="stylesheet" href="css/global.css">
  <style>
    body.browser-layout {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .app-container {
      display: flex;
      flex: 1;
      margin-top: 64px;
      height: calc(100vh - 64px);
      overflow: hidden;
    }
    
    /* Left Sidebar: Concept List */
    .sidebar-left {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(13, 10, 40, 0.6);
      border-right: 1px solid var(--clr-border);
      z-index: 10;
    }
    .concept-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--sp-md) 0;
    }
    .concept-item {
      padding: 16px var(--sp-md);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all var(--t-fast);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .concept-item:hover {
      background: var(--clr-glass);
    }
    .concept-item.active {
      background: var(--clr-glass-2);
      border-left-color: var(--clr-gold);
    }
    .concept-item-deva {
      font-size: 1.25rem;
      color: var(--clr-gold);
      font-family: var(--font-deva);
    }
    .concept-item-iast {
      font-size: 0.9rem;
      color: var(--clr-text-2);
      margin-top: 4px;
    }

    /* Main Content: Concept Detail */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--sp-2xl);
      background: radial-gradient(circle at center, rgba(123, 94, 167, 0.05) 0%, transparent 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .concept-detail-container {
      max-width: 800px;
      width: 100%;
    }
    
    .concept-header {
      text-align: center;
      margin-bottom: var(--sp-xl);
    }
    .concept-title {
      font-size: 3rem;
      color: var(--clr-gold);
      text-shadow: var(--shadow-gold);
      margin-bottom: var(--sp-sm);
    }
    .concept-subtitle {
      font-size: 1.5rem;
      color: var(--clr-text);
      letter-spacing: 0.05em;
    }
    
    .concept-image-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--r-lg);
      overflow: hidden;
      margin-bottom: var(--sp-xl);
      border: 1px solid var(--clr-border);
      box-shadow: var(--shadow-card);
    }
    .concept-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .concept-definition {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      line-height: 1.8;
      color: var(--clr-text);
      background: var(--clr-glass);
      padding: var(--sp-2xl);
      border-radius: var(--r-lg);
      border: 1px solid var(--clr-border);
      margin-bottom: var(--sp-2xl);
    }
    
    /* Relevant Karikas Section */
    .relevant-karikas-section h3 {
      color: var(--clr-purple-2);
      margin-bottom: var(--sp-lg);
      text-align: center;
      font-size: 1.5rem;
      border-bottom: 1px solid var(--clr-border);
      padding-bottom: var(--sp-sm);
    }
    
    .karika-card {
      background: var(--clr-glass-2);
      border: 1px solid var(--clr-border-2);
      border-radius: var(--r-md);
      padding: var(--sp-lg);
      margin-bottom: var(--sp-md);
      transition: all var(--t-fast);
      text-decoration: none;
      display: block;
    }
    .karika-card:hover {
      transform: translateY(-2px);
      border-color: var(--clr-gold);
      box-shadow: 0 4px 20px rgba(201,169,110,0.15);
    }
    .karika-card-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--sp-sm);
      color: var(--clr-gold);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .karika-sanskrit {
      font-family: var(--font-deva);
      font-size: 1.2rem;
      color: var(--clr-text);
      margin-bottom: var(--sp-sm);
      line-height: 1.5;
    }
    .karika-english {
      font-family: var(--font-serif);
      color: var(--clr-text-2);
      font-size: 1rem;
    }
    .read-more {
      display: inline-block;
      margin-top: var(--sp-md);
      color: var(--clr-purple-2);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .karika-card:hover .read-more {
      color: var(--clr-gold);
    }
    
    @media (max-width: 768px) {
      .app-container { flex-direction: column; overflow: auto; }
      .sidebar-left { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--clr-border); flex: none; max-height: 30vh;}
      .main-content { overflow: visible; padding: var(--sp-lg); flex: none;}
    }
  </style>
</head>
<body class="browser-layout">

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <span class="brand-deva">वाक्यपदीयम्</span>
      <span class="brand-en">Vākyapadīyam</span>
    </a>
    <div class="navbar-nav">
      <a href="index.html"><span class="nav-icon">🏠</span> Home</a>
      <a href="concepts.html" class="active"><span class="nav-icon">🧠</span> Explore Concepts</a>
      <a href="text.html"><span class="nav-icon">📖</span> Text Browser</a>
      <a href="scholar.html"><span class="nav-icon">📚</span> Scholar</a>
      <a href="search.html"><span class="nav-icon">🔍</span> Search</a>
      <a href="chat.html"><span class="nav-icon">🤖</span> AI Chat</a>
    </div>
  </nav>

  <div class="app-container">
    
    <!-- Left Panel: Concept List -->
    <aside class="sidebar-left glass">
      <div class="p-md text-center" style="border-bottom: 1px solid var(--clr-border);">
        <h3 class="text-gold">Core Concepts</h3>
      </div>
      <div class="concept-list" id="concept-list">
        <!-- Populated by JS -->
      </div>
    </aside>

    <!-- Center Panel: Concept Detail -->
    <main class="main-content">
      <div id="concept-display" class="concept-detail-container animate-fadeInUp">
        <div class="text-center p-lg text-muted">Loading concepts...</div>
      </div>
    </main>

  </div>

  <script src="js/app.js"></script>
  <script src="js/concepts.js"></script>
</body>
</html>
