        :root {

            --border: #E0E0E0;
            --font-heading: 'Georgia', serif;
            --font-body: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--secondary);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }

        header h1 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        header .subtitle {
            font-size: 0.9rem;
            color: #C5CAE9;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar - Navigation */
        .sidebar {
            width: 350px;
            background: white;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .category-header {
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.8rem 1.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1.5px;
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 1px solid var(--border);
            border-top: 1px solid var(--border);
        }

        .guru-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-heading);
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .guru-item:hover {
            background-color: #F5F5F5;
            padding-left: 2rem;
        }

        .guru-item.active {
            background-color: var(--primary);
            color: white;
            border-left: 6px solid var(--secondary);
            font-weight: bold;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 3rem 4rem;
            overflow-y: auto;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .content-card {
            background: white;
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 900px;
            margin: 0 auto;
            border-top: 8px solid var(--primary);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guru-title {
            font-family: var(--font-heading);
            color: var(--secondary);
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }

        .guru-domain {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: var(--secondary);
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .description {
            line-height: 1.8;
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 2rem;
            text-align: justify;
        }

        .works-list {
            list-style: none;
        }

        .works-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.8rem;
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .works-list li::before {
            content: "•";
            color: var(--primary);
            font-size: 1.5rem;
            position: absolute;
            left: 0;
            top: -5px;
        }

        .work-title {
            font-weight: 600;
            color: var(--secondary);
            font-style: italic;
        }

        /* IITG Branding overlay */
        .iitg-badge {
            text-align: right;
            font-family: var(--font-heading);
            font-size: 1.1rem;
        }
    </style>
</head>

                        domain: "Viśiṣṭādvaita Vedānta",
                        desc: "The great 11th-century theologian who synthesized intellectual philosophy with intense emotional devotion (Bhakti). He proposed Viśiṣṭādvaita (qualified non-dualism), arguing that the world and souls are real and form the 'body' of the Supreme Lord (Nārāyaṇa).",
                        works: [
                            { title: "Śrībhāṣya", desc: "His magnum opus, a detailed commentary on the Brahmasūtras refuting strict non-dualism." },
                            { title: "Vedārthasaṅgraha", desc: "An independent treatise summarizing the core philosophy of the Upaniṣads." },
                            { title: "Gītābhāṣya", desc: "A devotional and philosophical commentary on the Bhagavad Gītā." }
                        ]
                    },
                    {
                        name: "Ācārya Abhinavagupta",
                        domain: "Kashmir Śaivism & Aesthetics",
                        desc: "One of the most brilliant minds of classical India. A philosopher, mystic, and aesthetician, he synthesized the non-dualistic Trika system of Kashmir Śaivism. He also significantly expanded Bharata Muni's Rasa theory to include 'Śānta' (peace) as the ultimate aesthetic experience.",
                        works: [
                            { title: "Tantrāloka", desc: "A massive, encyclopedic synthesis of all Tantric and Śaiva philosophies." },
                            { title: "Abhinavabhāratī", desc: "The most authoritative commentary on the Nāṭyaśāstra." },
                            { title: "Dhvanyālokalocana", desc: "A commentary on literary aesthetics establishing 'Dhvani' (suggestion) as the soul of poetry." }
                        ]
                    },
                    {
                        name: "Āṇḍāl",
                        domain: "Śrīvaiṣṇava Bhakti",
                        desc: "The only female Āḻvār (Tamil Vaishnava saint). Her poetry is characterized by an intense, passionate, and unyielding devotion to Lord Vishnu (Ranganatha). Rejecting earthly marriage, she saw herself entirely as the divine bride, deeply influencing South Indian temple traditions.",
                        works: [
                            { title: "Tiruppavai", desc: "A collection of 30 Tamil verses sung during the month of Margazhi to wake and worship the Lord." },
                            { title: "Nachiyar Tirumozhi", desc: "A set of 143 verses expressing profound mystical longing and devotion for the Divine." }
                        ]
                    }
                ]
            }
        ];

        let activeIndex = { cat: 0, guru: 0 };

        function initApp() {
            renderSidebar();
            renderContent(0, 0);
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';

            guruData.forEach((categoryObj, catIdx) => {
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerText = categoryObj.category;
                sidebar.appendChild(header);

                categoryObj.gurus.forEach((guru, guruIdx) => {
                    const item = document.createElement('div');
                    item.className = 'guru-item';
                    item.innerText = guru.name;
                    item.onclick = () => {
                        activeIndex = { cat: catIdx, guru: guruIdx };
                        updateActiveState();
                        renderContent(catIdx, guruIdx);
                    };
                    sidebar.appendChild(item);
                });
            });
            updateActiveState();
        }

        function updateActiveState() {
            const items = document.querySelectorAll('.guru-item');
            let counter = 0;
            guruData.forEach((categoryObj, catIdx) => {
                categoryObj.gurus.forEach((guru, guruIdx) => {
                    if (catIdx === activeIndex.cat && guruIdx === activeIndex.guru) {
                        items[counter].classList.add('active');
                    } else {
                        items[counter].classList.remove('active');
                    }
                    counter++;
                });
            });
        }

        function renderContent(catIdx, guruIdx) {
            const guru = guruData[catIdx].gurus[guruIdx];
            const card = document.getElementById('content-card');
            
            // trigger animation
            card.style.animation = 'none';
            card.offsetHeight; /* trigger reflow */
            card.style.animation = null; 

            let worksHTML = guru.works.map(work => 
                `<li><span class="work-title">${work.title}</span> — ${work.desc}</li>`
            ).join('');

            let activityHTML = guru.activity ? `
                <div class="section-title">Interactive Activity</div>
                <p class="description"><strong>${guru.activity.split(':')[0]}:</strong>${guru.activity.substring(guru.activity.indexOf(':') + 1)}</p>
            ` : '';

            card.innerHTML = `
                <div class="guru-domain">${guru.domain}</div>
                <h2 class="guru-title">${guru.name}</h2>
                <div class="section-title">Life & Philosophy</div>
                <p class="description">${guru.desc}</p>
                
                ${activityHTML}

                <div class="section-title">Complete Major Works</div>
                <ul class="works-list">
                    ${worksHTML}
                </ul>
            `;
        }

        // Initialize on load
        window.onload = initApp;
    </script>
</body>
</html>
